[project]
name = "process-map-studio-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
mypy_path = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: calls the real Claude API; run only when Eric asks (pytest -m live)",
]

[tool.coverage.run]
branch = true
