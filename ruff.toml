# One lint and format rule set for the whole repository (backend and scripts).
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PLW1510"]

[lint.isort]
known-first-party = ["app", "tests"]

[lint.per-file-ignores]
# Fixture documents quote PRD Appendix A sentences verbatim; don't force-wrap them.
"backend/tests/fixtures/**" = ["E501"]
